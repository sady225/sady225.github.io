<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖縄県NPO検索・地図サイト</title>

    <!-- Google Fonts: Inter & Noto Sans JP -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap"
        rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- MarkerCluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-layout">
        <!-- Header -->
        <header class="app-header">
            <div class="header-logo">
                <span class="logo-icon">🗺️</span>
                <h1>沖縄県NPO法人検索マップ</h1>
            </div>
            <div class="header-meta">
                <span class="data-source">
                    データ出典: <a
                        href="https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/004/890/20250421itiran.pdf"
                        target="_blank" rel="noopener noreferrer">沖縄県 特定非営利活動法人一覧（令和7年4月21日現在）</a><br>
                    <span style="font-size: 11px; color: #94a3b8;">※上記PDFリンク切れの場合は<a
                            href="https://www.pref.okinawa.lg.jp/kurashikankyo/katsudo/1004889/index.html"
                            target="_blank" rel="noopener noreferrer"
                            style="color: #94a3b8; text-decoration: underline;">県公式ページ</a>をご参照ください</span>
                </span>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="main-content">

            <!-- Sidebar: Filters & List -->
            <aside class="sidebar">

                <!-- Filters Area -->
                <div class="filter-panel">
                    <div class="search-wrap">
                        <input type="text" id="searchInput" placeholder="法人名で検索...">
                        <span class="search-icon">🔍</span>
                    </div>

                    <div class="filter-group">
                        <label>地域（北部 / 中部 / 南部 / 離島）</label>
                        <div class="button-group" id="regionButtonGroup">
                            <!-- JSで動的に追加 -->
                        </div>
                    </div>

                    <div class="filter-group">
                        <label>市町村</label>
                        <div class="button-group" id="municipalityButtonGroup"
                            style="background-color: #f8fafc; padding: 8px; border-radius: 8px; border: 1px dashed var(--border-color);">
                            <span
                                style="font-size: 13px; color: var(--text-muted); padding: 4px;">（先に地域を選択してください）</span>
                        </div>
                    </div>

                    <div class="filter-group activity-group">
                        <label>活動の種類 <span class="badge" id="activityCount">0</span></label>
                        <div class="checkbox-grid" id="categoryCheckboxes">
                            <!-- JSで動的に追加 -->
                        </div>
                        <div class="filter-actions">
                            <button id="clearFiltersBtn" class="btn-clear text-sm">条件をクリア</button>
                        </div>
                    </div>
                </div>

                <!-- List Area -->
                <div class="list-panel">
                    <div class="list-header">
                        <h2 class="result-title">検索結果</h2>
                        <div class="result-count"><span id="resultNumber">0</span>件</div>
                    </div>
                    <div class="npo-list" id="npoList">
                        <!-- NPO Cards render here -->
                        <div class="loading-state">データを読み込んでいます...</div>
                    </div>
                </div>
            </aside>

            <!-- Map Area -->
            <section class="map-container">
                <div id="map"></div>
            </section>

        </main>
    </div>

    <!-- Leaflet & MarkerCluster JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <script type="module" src="app.js"></script>
</body>

</html>
