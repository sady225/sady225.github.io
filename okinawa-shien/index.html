<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1f2e">
    <title>沖縄 支援情報 Pro 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');

        :root {
            --ocean: #0077a8;
            --sea: #00b4cc;
            --foam: #e0f7fa;
            --coral: #e8503a;
            --hibiscus: #c62828;
            --turmeric: #d4880a;
            --turmeric-lt: #fff8e1;
            --jade: #2e7d32;
            --jade-lt: #e8f5e9;
            --sand: #faf6ef;
            --sand2: #f0e8d8;
            --ink: #1a1f2e;
            --ink2: #3a4055;
            --mist: #7a8899;
            --white: #ffffff;
            --r2: 22px;
            --gap: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            height: 100%;
            font-family: 'Noto Sans JP', sans-serif;
            background: var(--sand);
            color: var(--ink);
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 960px;
            margin: 0 auto;
        }

        /* HEADER */
        .hdr {
            background: var(--ink);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 3px solid var(--sea);
        }

        .hdr-title {
            color: white;
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 900;
        }

        .hdr-pulse {
            background: var(--coral);
            color: white;
            font-size: 10px;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }

        /* REGION TABS */
        .tabs {
            display: flex;
            background: var(--ink2);
            padding: 8px 10px;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
            flex-shrink: 0;
        }

        .tab {
            flex: 1;
            min-width: 75px;
            padding: 10px 4px;
            border: none;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.5);
            transition: 0.2s;
            white-space: nowrap;
        }

        .tab.on {
            background: var(--sea);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 180, 204, 0.3);
        }

        /* PERSONA CHIPS (EXTENDED) */
        .persona-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background: var(--sand2);
            scrollbar-width: none;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .chip {
            white-space: nowrap;
            padding: 6px 14px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .chip.active {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
        }

        /* MAIN SCROLL */
        .scroll {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
        }

        .panel {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .panel.on {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* BENTO GRID */
        .bento {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: var(--gap);
            margin-bottom: 15px;
        }

        .c2 {
            grid-column: span 2;
        }

        .c3 {
            grid-column: span 3;
        }

        .c4 {
            grid-column: span 4;
        }

        .c6 {
            grid-column: span 6;
        }

        .r2 {
            grid-row: span 2;
        }

        .cell {
            background: var(--white);
            border-radius: var(--r2);
            padding: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .cell:active {
            transform: scale(0.98);
        }

        .cell::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
        }

        .a-sea::after {
            background: var(--sea);
        }

        .a-coral::after {
            background: var(--coral);
        }

        .a-jade::after {
            background: var(--jade);
        }

        .a-turmeric::after {
            background: var(--turmeric);
        }

        .cell-hero {
            color: white;
            padding: 18px;
            border-radius: var(--r2);
            position: relative;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .cell-hero::before {
            content: attr(data-emoji);
            position: absolute;
            right: -5px;
            bottom: -10px;
            font-size: 75px;
            opacity: 0.2;
        }

        /* COMPONENTS */
        .lbl {
            display: inline-block;
            font-size: 10px;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .lbl-white {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .ct {
            font-size: 15px;
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 8px;
        }

        .dr {
            display: flex;
            gap: 6px;
            font-size: 11px;
            border-bottom: 1px solid #f2f2f2;
            padding: 5px 0;
            align-items: center;
        }

        .dk {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            color: white;
            font-weight: 700;
            flex-shrink: 0;
        }

        .alrt {
            background: var(--turmeric-lt);
            border-left: 4px solid var(--turmeric);
            padding: 10px;
            font-size: 11px;
            border-radius: 0 10px 10px 0;
            margin-top: 10px;
            line-height: 1.5;
        }

        /* MODAL */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
            padding: 20px;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 450px;
            border-radius: 28px;
            padding: 30px;
            position: relative;
            animation: modalUp 0.3s ease-out;
        }

        @keyframes modalUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            border: none;
            background: #eee;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 900;
        }

        /* BOTTOM NAV */
        .catnav {
            background: var(--ink);
            padding: 8px 10px calc(10px + env(safe-area-inset-bottom));
            flex-shrink: 0;
            border-top: 2px solid var(--sea);
        }

        .catnav-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .catbtn {
            flex-shrink: 0;
            padding: 10px 16px;
            border-radius: 14px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .catbtn.on {
            background: var(--white);
            color: var(--ink);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .cat-ico {
            font-size: 18px;
        }

        @media (max-width: 500px) {
            .bento {
                grid-template-columns: repeat(2, 1fr);
            }

            .c2,
            .c3,
            .c4,
            .c6 {
                grid-column: span 2;
            }

            .r2 {
                grid-row: auto;
            }
        }
    </style>
</head>

<body>

    <div class="app">
        <header class="hdr">
            <div class="hdr-title">🌺 沖縄 支援情報 Pro</div>
            <div class="hdr-pulse">2026年3月版</div>
        </header>

        <nav class="tabs" id="top-tabs">
            <button class="tab on" onclick="APP.nav('all', 'tab')">🗾 全市町村</button>
            <button class="tab" onclick="APP.nav('yomitan', 'tab')">🌿 読谷村</button>
            <button class="tab" onclick="APP.nav('tomi', 'tab')">🏙 豊見城市</button>
            <button class="tab" onclick="APP.nav('kita', 'tab')">🌸 北中城村</button>
            <button class="tab" onclick="APP.nav('uruma', 'tab')">🌊 うるま市</button>
        </nav>

        <div class="persona-chips">
            <div class="chip" data-type="kids" onclick="APP.toggleChip(this)">👶 子育て中</div>
            <div class="chip" data-type="aged" onclick="APP.toggleChip(this)">👵 高齢・障害</div>
            <div class="chip" data-type="care" onclick="APP.toggleChip(this)">🤝 介護</div>
            <div class="chip" data-type="tax" onclick="APP.toggleChip(this)">🏢 非課税世帯</div>
        </div>

        <main class="scroll" id="main-scroll">
            <div id="p-all" class="panel on">
                <div class="bento">
                    <div class="cell-hero c6" data-emoji="🔥"
                        style="background: linear-gradient(135deg, #c0392b, #e8503a)"
                        onclick="APP.openDetail('ene_camp')">
                        <div class="lbl lbl-white">全市町村共通・注目</div>
                        <div class="ct" style="font-size: 18px;">省エネ家電買換キャンペーン</div>
                        <div style="font-size: 11px; opacity: 0.9;">3/13〜 スタート！最大数万円分を還元</div>
                    </div>
                    <div class="cell a-coral c3" onclick="APP.openDetail('ele_gas')">
                        <div class="lbl" style="background: #ffebee; color: var(--coral);">⏰ 3月終了</div>
                        <div class="ct">電気・ガス代補助</div>
                        <div class="dr"><span class="dk" style="background:var(--coral)">影響</span> 4月から負担増</div>
                    </div>
                    <div class="cell a-jade c3" onclick="APP.openDetail('nenkin')">
                        <div class="lbl" style="background: var(--jade-lt); color: var(--jade);">📈 4月増額</div>
                        <div class="ct">年金生活者支援金</div>
                        <div class="dr"><span class="dk" style="background:var(--jade)">確定</span> 3.2%アップ</div>
                    </div>
                </div>
            </div>

            <div id="p-yomitan" class="panel">
                <div class="bento">
                    <div class="cell-hero c6" data-emoji="🌿"
                        style="background: linear-gradient(135deg, #1b5e20, #43a047)">
                        <div class="ct" style="font-size: 20px;">読谷村 支援情報</div>
                    </div>
                    <div class="cell a-jade c4" onclick="APP.openDetail('yomi_kids')">
                        <div class="lbl" style="background:var(--jade-lt); color:var(--jade);">👶 子育て応援手当</div>
                        <div class="ct" style="font-size: 24px;">¥20,000</div>
                        <div class="dr"><span class="dk" style="background:var(--jade)">締切</span> 4月30日まで</div>
                    </div>
                    <div class="cell a-coral c2">
                        <div class="ct">💧 水道免除<br>今月で終了</div>
                    </div>
                </div>
            </div>

            <div id="p-uruma" class="panel">
                <div class="bento">
                    <div class="cell-hero c6" data-emoji="🌊"
                        style="background: linear-gradient(135deg, #01579b, #0288d1)">
                        <div class="ct">うるま市 支援情報</div>
                    </div>
                    <div class="cell a-sea c6" onclick="APP.openDetail('uruma_care')">
                        <div class="lbl" style="background:var(--foam); color:var(--ocean);">📅 3/19 振込</div>
                        <div class="ct">在宅介護支援金：¥60,000</div>
                        <div class="alrt">通帳記入の準備をしてください。</div>
                    </div>
                </div>
            </div>

        </main>

        <footer class="catnav">
            <div class="catnav-row">
                <button class="catbtn on" onclick="APP.nav('all', 'cat')"><span class="cat-ico">🏠</span>すべて</button>
                <button class="catbtn" onclick="APP.nav('energy', 'cat')"><span class="cat-ico">💡</span>光熱費</button>
                <button class="catbtn" onclick="APP.nav('kids', 'cat')"><span class="cat-ico">👶</span>子育て</button>
                <button class="catbtn" onclick="APP.nav('care', 'cat')"><span class="cat-ico">🤝</span>介護</button>
                <button class="catbtn" onclick="APP.nav('news', 'cat')"><span class="cat-ico">📢</span>新着</button>
            </div>
        </footer>
    </div>

    <div id="modal" class="modal" onclick="if(event.target==this) APP.closeDetail()">
        <div class="modal-content">
            <button class="close-btn" onclick="APP.closeDetail()">✕</button>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const APP = {
            // ナビゲーション
            nav: function (id, type) {
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
                const target = document.getElementById('p-' + id);
                if (target) target.classList.add('on');

                const btnClass = type === 'tab' ? '.tab' : '.catbtn';
                document.querySelectorAll('.tab, .catbtn').forEach(b => b.classList.remove('on'));
                event.currentTarget.classList.add('on');

                document.getElementById('main-scroll').scrollTop = 0;
            },

            // チップ選択
            toggleChip: function (el) {
                el.classList.toggle('active');
                // ここに属性に応じたフィルタリングロジックを将来的に追加可能
            },

            // モーダル詳細データ
            openDetail: function (key) {
                const data = {
                    ene_camp: {
                        t: "省エネ家電買換応援キャンペーン",
                        c: "エアコン・冷蔵庫・テレビの買い替えを支援。3月13日以降の購入が対象です。<br><br><b>対象：</b>全県民<br><b>還元：</b>最大数万円相当（地域協力店で上乗せあり）"
                    },
                    yomi_kids: {
                        t: "読谷村：子育て応援手当",
                        c: "1世帯あたり2万円を支給。公務員や新入生などは申請が必要です。<br><br><b>期限：</b>2026年4月30日<br><b>場所：</b>読谷村役場 児童家庭課"
                    },
                    uruma_care: {
                        t: "うるま市：在宅介護支援金",
                        c: "年額6万円が3月19日に一括振込されます。<br><br><b>確認方法：</b>通帳記入で「ウルマシザイタクカイゴ」の印字を確認してください。"
                    },
                    ele_gas: {
                        t: "電気・ガス代補助の終了",
                        c: "国の物価高対策が3月検針分で終了します。4月以降、月額数千円の家計負担増が予想されます。"
                    },
                    nenkin: {
                        t: "年金生活者支援給付金の増額",
                        c: "物価高を反映し、4月分から3.2%引き上げられます。実際の入金は6月の振込日からとなります。"
                    }
                };

                const item = data[key] || { t: "詳細情報", c: "準備中..." };
                document.getElementById('modal-body').innerHTML = `
            <h2 style="margin-bottom:15px; font-size:18px;">${item.t}</h2>
            <p style="line-height:1.6; font-size:14px; color:#444;">${item.c}</p>
            <button onclick="APP.closeDetail()" style="width:100%; margin-top:20px; padding:12px; border-radius:12px; border:none; background:var(--ink); color:white; font-weight:bold;">閉じる</button>
        `;
                document.getElementById('modal').style.display = 'flex';
            },

            closeDetail: function () {
                document.getElementById('modal').style.display = 'none';
            }
        };
    </script>
</body>

</html>
