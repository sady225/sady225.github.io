<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>沖縄 支援ガイド Pro | 2026</title>
    <style>
        /* 基本スタイルは継承しつつ、拡張分を追加 */
        :root {
            --accent: #ff3e00;
            --glass: rgba(255, 255, 255, 0.8);
        }

        /* 拡張: マイ・ステータス選択 (チップス) */
        .persona-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 16px;
            background: var(--sand2);
            scrollbar-width: none;
        }

        .chip {
            white-space: nowrap;
            padding: 6px 14px;
            background: white;
            border: 1px solid var(--sand3);
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .chip.active {
            background: var(--ink);
            color: white;
            border-color: var(--ink);
        }

        /* 拡張: モーダル（詳細表示） */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 24px;
            padding: 24px;
            position: relative;
            animation: modalUp 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        @keyframes modalUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            font-size: 20px;
            border: none;
            background: none;
            cursor: pointer;
        }

        /* 重要度バッジ */
        .badge-urgent {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--coral);
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <div class="app">
        <div class="persona-chips">
            <div class="chip" onclick="this.classList.toggle('active')">👶 子育て中</div>
            <div class="chip" onclick="this.classList.toggle('active')">👴 高齢者</div>
            <div class="chip" onclick="this.classList.toggle('active')">🤝 介護</div>
            <div class="chip" onclick="this.classList.toggle('active')">🚗 車所有</div>
            <div class="chip" onclick="this.classList.toggle('active')">🏢 非課税世帯</div>
        </div>

        <main class="scroll">
            <div class="bento">
                <div class="cell a-sea c6" onclick="UI.openDetail('ene')">
                    <span class="badge-urgent">締切間近</span>
                    <div class="ct">省エネ家電キャンペーン</div>
                    <div class="dr">タップして「対象店舗リスト」を確認</div>
                </div>

                <div class="cell a-jade c3" onclick="UI.addToCalendar('2026-03-19', 'うるま市在宅介護支援金 振込日')">
                    <div class="ct">📅 3/19 振込</div>
                    <div class="dr">カレンダーに保存</div>
                </div>
            </div>
        </main>
    </div>

    <div id="detail-modal" class="modal" onclick="if(event.target==this) UI.closeDetail()">
        <div class="modal-content">
            <button class="close-btn" onclick="UI.closeDetail()">×</button>
            <div id="modal-body">
            </div>
        </div>
    </div>

    <script>
        const UI = {
            // モーダル表示ロジック
            openDetail: function (type) {
                const body = document.getElementById('modal-body');
                const data = {
                    ene: {
                        title: "省エネ家電買換応援キャンペーン",
                        desc: "エアコン、冷蔵庫、テレビが対象です。読谷村の協力店で購入すると、県からの還元に加え、村独自の特典がつく場合があります。",
                        links: "<li><a href='#'>読谷村公式ページ</a></li><li><a href='#'>対象店舗マップ</a></li>",
                        items: "領収書、保証書、設置後の写真"
                    }
                };

                const content = data[type];
                body.innerHTML = `
            <h2 style="margin-bottom:12px">${content.title}</h2>
            <p style="font-size:14px; line-height:1.6; color:#555;">${content.desc}</p>
            <h3 style="margin:16px 0 8px; font-size:13px;">📝 必要なもの</h3>
            <div style="background:#f9f9f9; padding:10px; border-radius:8px; font-size:13px;">${content.items}</div>
            <h3 style="margin:16px 0 8px; font-size:13px;">🔗 リンク</h3>
            <ul style="font-size:13px; color:var(--ocean);">${content.links}</ul>
        `;
                document.getElementById('detail-modal').style.display = 'flex';
            },
            closeDetail: function () {
                document.getElementById('detail-modal').style.display = 'none';
            },
            // カレンダー登録（簡易版）
            addToCalendar: function (date, title) {
                alert(date + "の予定「" + title + "」を端末のカレンダーに追加する機能を呼び出します。");
                // 実際には .ics ファイルの生成や Google Calendar URL の生成を行います
            }
        };
    </script>
</body>

</html>
