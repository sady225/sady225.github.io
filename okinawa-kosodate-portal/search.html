<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索 | 沖縄子育て支援ポータル</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- ヘッダー -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-heart-fill"></i> 沖縄子育て支援ポータル
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">ホーム</a></li>
          <li class="nav-item"><a class="nav-link active" href="search.html">検索</a></li>
        </ul>
        <div class="d-flex align-items-center" id="userArea">
          <a href="#" class="btn btn-outline-light btn-sm me-2" data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="bi bi-person"></i> ログイン
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row">
      <!-- サイドバー（フィルター） -->
      <div class="col-lg-3 mb-4">
        <div class="filter-sidebar">
          <h5><i class="bi bi-funnel"></i> 絞り込み</h5>
          <form id="filterForm">
            <!-- キーワード -->
            <div class="mb-3">
              <label class="form-label">キーワード</label>
              <input type="text" id="searchKeyword" class="form-control" placeholder="キーワードを入力...">
            </div>

            <!-- カテゴリ -->
            <div class="mb-3">
              <label class="form-label">カテゴリ</label>
              <select id="filterCategory" class="form-select">
                <option value="">すべて</option>
                <option value="💰 助成金・給付金">💰 助成金・給付金</option>
                <option value="🍚 食料・物資支援">🍚 食料・物資支援</option>
                <option value="📅 イベント">📅 イベント</option>
                <option value="🏛️ 制度・条例">🏛️ 制度・条例</option>
                <option value="🏠 施設・サービス">🏠 施設・サービス</option>
                <option value="📋 その他">📋 その他</option>
              </select>
            </div>

            <!-- 市町村 -->
            <div class="mb-3">
              <label class="form-label">市町村</label>
              <select id="filterCity" class="form-select">
                <option value="">すべて</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-search"></i> 検索
            </button>
            <a href="search.html" class="btn btn-outline-secondary w-100 mt-2">
              <i class="bi bi-x"></i> クリア
            </a>
          </form>
        </div>

        <!-- 広告エリア（無料ユーザー向け） -->
        <div class="ad-area mt-4">
          <small class="text-muted">広告</small>
          <p class="mb-0">ここに広告が表示されます</p>
        </div>
      </div>

      <!-- 検索結果 -->
      <div class="col-lg-9">
        <h4 class="mb-4"><i class="bi bi-search"></i> 検索結果</h4>
        <div id="searchResults">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- フッター -->
  <footer class="bg-dark text-white py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">&copy; 2024 沖縄子育て支援ポータル</p>
    </div>
  </footer>

  <!-- ログインモーダル -->
  <div class="modal fade" id="loginModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title"><i class="bi bi-person"></i> ログイン</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label">メールアドレス</label>
              <input type="email" class="form-control" id="loginEmail" required>
            </div>
            <div class="mb-3">
              <label class="form-label">パスワード</label>
              <input type="password" class="form-control" id="loginPassword" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">ログイン</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
