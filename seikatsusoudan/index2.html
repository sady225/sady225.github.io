<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>沖縄県 窓口一覧 PWA</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="沖縄サポート">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2555/2555572.png">
    <link rel="manifest" id="my-manifest">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --shuri-red: #B33E3E;
            --ryukyu-blue: #005B99;
            --sand-white: #F7F3F0;
            --color-north: #0ea5e9;
            --color-central: #10b981;
            --color-south: #f59e0b;
            --color-islands: #8b5cf6;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--sand-white);
            color: #333;
            overflow-x: hidden;
        }

        header {
            padding-top: env(safe-area-inset-top);
        }

        .text-shuri {
            color: var(--shuri-red);
        }

        /* バーガーメニュー（ドロワー） */
        #side-menu {
            transition: transform 0.3s ease-in-out;
            transform: translateX(-100%);
            z-index: 2000;
        }

        #side-menu.open {
            transform: translateX(0);
        }

        #overlay {
            display: none;
            z-index: 1999;
            background: rgba(0, 0, 0, 0.5);
        }

        #overlay.open {
            display: block;
        }

        /* エリア別クラス */
        .region-btn.active-all {
            background-color: #475569 !important;
            color: white !important;
        }

        .region-btn.active-north {
            background-color: var(--color-north) !important;
            color: white !important;
        }

        .region-btn.active-central {
            background-color: var(--color-central) !important;
            color: white !important;
        }

        .region-btn.active-south {
            background-color: var(--color-south) !important;
            color: white !important;
        }

        .region-btn.active-islands {
            background-color: var(--color-islands) !important;
            color: white !important;
        }

        .border-north {
            border-left: 4px solid var(--color-north);
        }

        .border-central {
            border-left: 4px solid var(--color-central);
        }

        .border-south {
            border-left: 4px solid var(--color-south);
        }

        .border-islands {
            border-left: 4px solid var(--color-islands);
        }

        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        #map {
            width: 100%;
            height: calc(100vh - 180px);
            z-index: 1;
            border-radius: 1.5rem;
            background: #e5e7eb;
        }

        @media (max-width: 768px) {
            #map {
                height: 60vh;
            }
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

<body>
    <div id="overlay" class="fixed inset-0" onclick="toggleMenu()"></div>

    <aside id="side-menu" class="fixed inset-y-0 left-0 w-64 bg-white shadow-2xl p-6 flex flex-col pt-20">
        <h2 class="text-xs font-bold text-slate-400 mb-6 tracking-widest uppercase">メニュー</h2>
        <nav class="flex flex-col gap-4">
            <button onclick="showPage('home')"
                class="flex items-center gap-3 text-lg font-bold text-slate-700 hover:text-shuri">
                <span>📋</span> リスト表示
            </button>
            <button onclick="showPage('map-page')"
                class="flex items-center gap-3 text-lg font-bold text-slate-700 hover:text-shuri">
                <span>🗺️</span> 地図で探す
            </button>
        </nav>
        <div class="mt-auto border-t pt-6">
            <p class="text-[10px] text-slate-400">&copy; AsonProject</p>
        </div>
    </aside>

    <div class="max-w-7xl mx-auto min-h-screen flex flex-col">
        <header class="sticky top-0 z-[1000] py-4 bg-[#F7F3F0]/95 backdrop-blur-sm px-4">
            <div class="flex items-center justify-between bg-white p-4 rounded-2xl shadow-md border border-orange-100">
                <button onclick="toggleMenu()" class="p-2 text-shuri text-2xl">☰</button>
                <h1 class="text-sm md:text-xl font-bold text-shuri text-center flex-grow">沖縄県 自立支援窓口一覧</h1>
                <div class="w-10"></div>
            </div>
        </header>

        <main class="flex-grow p-4">
            <div id="page-home" class="page-content active">
                <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-orange-50">
                    <h3 class="font-bold text-slate-800 mb-4 text-lg">📍 県内全域 窓口リスト</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 text-sm" id="homeList"></div>
                </div>
            </div>

            <div id="page-map-page" class="page-content">
                <div class="flex flex-col bg-white rounded-[2rem] shadow-sm border border-orange-100 overflow-hidden">
                    <div class="p-4 border-b bg-slate-50">
                        <div class="flex gap-2 overflow-x-auto pb-2 custom-scroll no-scrollbar">
                            <button onclick="filterRegion('すべて')"
                                class="region-btn shrink-0 px-4 py-2 rounded-full text-[10px] font-bold bg-white border">すべて</button>
                            <button onclick="filterRegion('北部')"
                                class="region-btn shrink-0 px-4 py-2 rounded-full text-[10px] font-bold bg-white border">北部</button>
                            <button onclick="filterRegion('中部')"
                                class="region-btn shrink-0 px-4 py-2 rounded-full text-[10px] font-bold bg-white border">中部</button>
                            <button onclick="filterRegion('南部')"
                                class="region-btn shrink-0 px-4 py-2 rounded-full text-[10px] font-bold bg-white border">南部</button>
                            <button onclick="filterRegion('離島')"
                                class="region-btn shrink-0 px-4 py-2 rounded-full text-[10px] font-bold bg-white border">離島</button>
                        </div>
                    </div>
                    <div class="p-2">
                        <div id="map"></div>
                    </div>
                    <div id="mapSidebarList" class="p-4 space-y-2 max-h-[40vh] overflow-y-auto bg-slate-50 border-t">
                    </div>
                </div>
            </div>
        </main>

        <footer class="p-8 text-center bg-white mt-8 rounded-t-[3rem] shadow-inner">
            <div class="max-w-3xl mx-auto mb-6">
                <h2 class="text-sm font-bold text-shuri mb-2 tracking-widest uppercase">出典・公式情報</h2>
                <a href="https://www.pref.okinawa.lg.jp/_res/projects/default_project/_page_/001/007/902/r7soudanmadoguchi.pdf"
                    target="_blank"
                    class="inline-flex items-center gap-2 text-blue-600 font-bold underline text-sm py-2">
                    📄 沖縄県内の自立相談支援機関 相談窓口一覧 (PDF)
                </a>
                <p class="text-[11px] text-slate-400 mt-4 leading-relaxed">
                    本サイトは、沖縄県が実施する「暮らしサポート事業」の情報を分かりやすく提供するためのポータルサイトです。
                </p>
            </div>
            <p class="text-slate-300 text-[11px] tracking-widest font-medium uppercase mt-4">&copy; AsonProject</p>
        </footer>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const locations = [
            { region: "南部", city: "那覇市", name: "那覇市 就職・生活支援パーソナルサポートセンター", tel: "098-917-5348", addr: "那覇市泉崎1-20-1 カフーナ旭橋A街区６階", lat: 26.2117, lng: 127.6788 },
            { region: "中部", city: "宜野湾市", name: "宜野湾市 福祉総務課 生活支援係", tel: "098-893-4480", addr: "宜野湾市野嵩1-1-1 宜野湾市役所内", lat: 26.2816, lng: 127.7778 },
            { region: "離島", city: "石垣市", name: "石垣市 福祉部 福祉総務課 総務係", tel: "0980-87-6025", addr: "沖縄県石垣市真栄里672番地", lat: 24.3468, lng: 124.1852 },
            { region: "中部", city: "浦添市", name: "浦添市 自立サポートセンター・てだこ未来", tel: "098-875-5065", addr: "浦添市安波茶1-1-1 浦添市役所内", lat: 26.2483, lng: 127.7246 },
            { region: "北部", city: "名護市", name: "名護市 くらしと仕事の応援センター さぽんちゅ", tel: "0980-53-1212", addr: "名護市港1-1-1 名護市役所内", lat: 26.5915, lng: 127.9775 },
            { region: "南部", city: "糸満市", name: "糸満市 くらしのサポートセンター きづき", tel: "098-840-8182", addr: "糸満市潮崎町1-1 糸満市役所内", lat: 26.1241, lng: 127.6695 },
            { region: "中部", city: "沖縄市", name: "沖縄市 就職・生活支援パーソナルサポートセンター", tel: "098-923-3624", addr: "沖縄市仲宗根町35-3", lat: 26.3387, lng: 127.8028 },
            { region: "南部", city: "豊見城市", name: "豊見城市 就職・生活支援パーソナルサポートセンター", tel: "098-850-1067", addr: "豊見城市宜保一丁目1番地1 豊見城市役所2階", lat: 26.1738, lng: 127.6749 },
            { region: "中部", city: "うるま市", name: "うるま市 就職・生活支援パーソナルサポートセンター", tel: "098-989-3972", addr: "うるま市みどり町1-1-1 うるま市役所内", lat: 26.3745, lng: 127.8604 },
            { region: "離島", city: "宮古島市", name: "宮古島市 生活福祉課 地域福祉係", tel: "0980-73-1962", addr: "宮古島市平良字西里1140番地", lat: 24.8055, lng: 125.2811 },
            { region: "南部", city: "南城市", name: "南城市 就職・生活支援パーソナルサポートセンター", tel: "098-917-5334", addr: "南城市佐敷字新里1870番地 南城市役所内", lat: 26.1586, lng: 127.7758 },
            { region: "北部", city: "沖縄県(北部)", name: "就職・生活支援パーソナルサポートセンター 北部", tel: "0980-43-0240", addr: "名護市大中3-9-1 官公労2階", lat: 26.5947, lng: 127.9814 },
            { region: "中部", city: "沖縄県(中部)", name: "就職・生活支援パーソナルサポートセンター 中部", tel: "098-923-0881", addr: "沖縄市明道1-21-5 1階", lat: 26.3686, lng: 127.8225 },
            { region: "南部", city: "沖縄県(南部支所)", name: "就職・生活支援パーソナルサポートセンター 南部支所", tel: "098-917-5407", addr: "那覇市泉崎1-22-1 カフーナ旭橋A街区 6階", lat: 26.2120, lng: 127.6791 },
            { region: "南部", city: "沖縄県(南部)", name: "就職・生活支援パーソナルサポートセンター 南部", tel: "098-851-7105", addr: "南風原町宮平496-21 SKSビル 1F", lat: 26.1956, lng: 127.7214 },
            { region: "離島", city: "沖縄県(久米島)", name: "久米島町就職・生活支援パーソナルサポートセンター", tel: "098-851-8335", addr: "久米島町字儀間5番地 協議会内", lat: 26.3315, lng: 126.7410 }
        ];

        let map, markers = [];
        const regionColorMap = { "北部": "border-north", "中部": "border-central", "南部": "border-south", "離島": "border-islands" };

        function toggleMenu() {
            document.getElementById('side-menu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function showPage(pageId) {
            toggleMenu();
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if (pageId === 'map-page') {
                setTimeout(() => { if (!map) initMap(); map.invalidateSize(); }, 300);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function initMap() {
            map = L.map('map', { zoomControl: false }).setView([26.3, 127.8], 9);
            L.control.zoom({ position: 'bottomright' }).addTo(map);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            filterRegion('すべて');
        }

        function filterRegion(region) {
            const buttons = document.querySelectorAll('.region-btn');
            buttons.forEach(btn => {
                btn.className = "region-btn shrink-0 px-4 py-2 rounded-full text-[10px] font-bold bg-white border transition-all";
                if (btn.innerText === region) {
                    const cls = region === 'すべて' ? 'active-all' :
                        region === '北部' ? 'active-north' :
                            region === '中部' ? 'active-central' :
                                region === '南部' ? 'active-south' : 'active-islands';
                    btn.classList.add(cls);
                }
            });
            const sidebar = document.getElementById('mapSidebarList');
            sidebar.innerHTML = '';
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            const filtered = region === 'すべて' ? locations : locations.filter(l => l.region === region);
            filtered.forEach(loc => {
                const marker = L.marker([loc.lat, loc.lng]).addTo(map);
                marker.bindPopup(`<div class="text-xs"><b>${loc.name}</b><br><a href="tel:${loc.tel}" class="text-blue-600 font-bold underline">📞 ${loc.tel}</a></div>`);
                markers.push(marker);
                const card = document.createElement('div');
                card.className = `p-3 bg-white rounded-xl border border-orange-100 shadow-sm text-[11px] ${regionColorMap[loc.region]}`;
                card.innerHTML = `<div class="font-bold text-slate-700">${loc.name}</div><div class="text-shuri font-bold mt-1">📞 ${loc.tel}</div>`;
                card.onclick = () => { map.flyTo([loc.lat, loc.lng], 14); marker.openPopup(); };
                sidebar.appendChild(card);
            });
            if (region === '離島') map.flyTo([25.0, 125.5], 7);
        }

        window.onload = () => {
            const container = document.getElementById('homeList');
            locations.forEach(loc => {
                container.innerHTML += `
                    <div class="p-4 bg-white rounded-2xl border border-orange-100 shadow-sm ${regionColorMap[loc.region]}">
                        <div class="font-bold text-slate-800 text-sm">${loc.city}</div>
                        <div class="text-[10px] text-slate-500 mb-2 leading-tight">${loc.name}</div>
                        <a href="tel:${loc.tel}" class="text-shuri font-bold text-sm active:opacity-50">📞 ${loc.tel}</a>
                    </div>`;
            });
        };
    </script>
</body>

</html>
