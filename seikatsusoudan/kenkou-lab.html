<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>心血管リスク管理(Fixed Auth)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/theme/white.css" id="theme">

  <style>
    :root { --accent: #2b6cb0; --accent2: #2f855a; --warn: #c53030; --soft: #f7fafc; }

    /* 認証画面：iPhone 12で入力しやすい高さに調整 */
    #auth-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #1a365d 0%, #2b6cb0 100%);
      display: flex; align-items: center; justify-content: center; z-index: 10000;
    }
    .auth-box {
      background: white; padding: 40px 20px; border-radius: 20px;
      width: 85%; max-width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    input[type="tel"] {
      width: 100%; padding: 15px; font-size: 22px; border: 2px solid #cbd5e0;
      border-radius: 12px; margin-bottom: 20px; text-align: center; letter-spacing: 0.1em;
      -webkit-appearance: none;
    }
    .btn-submit {
      background: #2b6cb0; color: white; border: none; width: 100%;
      padding: 16px; border-radius: 12px; font-weight: bold; font-size: 1.1em;
    }
    .error-msg { color: #e53e3e; font-size: 0.9em; margin-top: 15px; display: none; font-weight: bold; }

    /* スライド表示設定 */
    .reveal { display: none; font-size: 18px; }
    .reveal h2 { font-size: 1.2em; color: var(--accent); border-left: 8px solid var(--accent); padding-left: 12px; text-align: left; }
    .card { background: var(--soft); padding: 15px; border-radius: 12px; margin-bottom: 10px; text-align: left; font-size: 0.75em; border-left: 5px solid var(--accent); }
    .chart-container { position: relative; height: 300px; width: 100%; margin: 15px 0; }
  </style>
</head>
<body>

  <div id="auth-screen">
    <div class="auth-box">
      <h2 style="margin-top:0; color:#2d3748;">HEALTH DATA</h2>
      <p style="color:#718096; font-size:0.8em; margin-bottom:20px;">パスワードを入力して解除</p>
      <input type="tel" id="pw" placeholder="0000000000" maxlength="10">
      <button class="btn-submit" onclick="verify()">UNLOCK</button>
      <div id="err" class="error-msg">パスワードが正しくありません</div>
    </div>
  </div>

  <div class="reveal">
    <div class="slides">
      <section>
        <h1 style="font-size: 1.4em;">心血管管理データ</h1>
        <div class="card" style="text-align:center; border:none; background:#ebf8ff;">
          BMI 28.9 / 心筋梗塞既往<br>
          直近血圧: 120-132 / 88-89
        </div>
      </section>

      <section>
        <h2>服用中の薬 (8種)</h2>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
          <div class="card" style="font-size:0.6em; margin:0;"><b>血栓</b><br>バイアスピリン</div>
          <div class="card" style="font-size:0.6em; margin:0;"><b>脂質</b><br>ロスバスタチン等</div>
          <div class="card" style="font-size:0.6em; margin:0;"><b>中性脂肪</b><br>EPA/DHA</div>
          <div class="card" style="font-size:0.6em; margin:0;"><b>血圧</b><br>降圧薬3種</div>
        </div>
      </section>

      <section>
        <h2>食事推奨度</h2>
        <div class="card" style="border-left-color: #d69e2e;"><b>◎ 積極摂取</b><br>青魚、ナッツ、トマト、玉ねぎ</div>
        <div class="card" style="border-left-color: var(--warn);"><b>× 控えるべき</b><br>菓子パン、甘い物、スナック菓子</div>
      </section>

      <section>
        <h2>糖代謝の推移</h2>
        <div class="chart-container"><canvas id="c1"></canvas></div>
      </section>

      <section>
        <h2>脂質・肝機能の推移</h2>
        <div class="chart-container"><canvas id="c2"></canvas></div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/reveal.js@5/dist/reveal.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    function verify() {
      const input = document.getElementById('pw').value;
      const target = "0989580875"; // 設定パスワード
      
      if (input === target) {
        document.getElementById('auth-screen').style.display = 'none';
        document.querySelector('.reveal').style.display = 'block';
        startReveal();
      } else {
        document.getElementById('err').style.display = 'block';
        document.getElementById('pw').value = '';
      }
    }

    function startReveal() {
      Reveal.initialize({ width: 390, height: 844, hash: true, center: true, touch: true });
      const labels = ["'25/9", "'25/11", "'26/1"];
      const opt = { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 10 } } } } };

      new Chart(document.getElementById("c1"), {
        type: "line",
        data: { labels, datasets: [
          { label: "HbA1c(%)", data: [6.1, 5.9, 6.1], borderColor: "#2b6cb0" },
          { label: "血糖", data: [103, 107, 88], borderColor: "#2f855a" }
        ]}, options: opt
      });

      new Chart(document.getElementById("c2"), {
        type: "line",
        data: { labels, datasets: [
          { label: "ALT", data: [48, 49, 49], borderColor: "#c53030" },
          { label: "HDL", data: [39, 36, 30], borderColor: "#2b6cb0" }
        ]}, options: opt
      });
    }
  </script>
</body>
</html>
